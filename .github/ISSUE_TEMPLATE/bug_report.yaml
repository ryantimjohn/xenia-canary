name: Kinect fork bug report
description: Report a reproducible bug in Xenia Canary Kinect.
title: "[Kinect] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Use this form for reproducible bugs in Xenia Canary Kinect. It collects
        the build revision, platform, sensor, backend, title ID, settings,
        patches, reproduction steps, and relevant logs.
  - type: input
    id: fork-commit
    attributes:
      label: Fork commit
      description: The short commit hash shown by your build, or say unknown.
      placeholder: e.g. abc1234 or unknown
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows
        - Linux
        - Other
    validations:
      required: true
  - type: dropdown
    id: sensor
    attributes:
      label: Sensor
      options:
        - Xbox 360 Kinect (verified setup)
        - Kinect for Windows sensor (not verified in current test record)
        - No live sensor (replay or nop)
        - Other
    validations:
      required: true
  - type: dropdown
    id: backend
    attributes:
      label: NUI backend
      options:
        - kinect
        - replay
        - nop
        - any
        - Other
    validations:
      required: true
  - type: input
    id: title-id
    attributes:
      label: Title ID
      description: Use the hexadecimal title ID from the emulator title bar, not the game name. For a startup failure before a title loads, enter N/A or 00000000.
      placeholder: 8-digit hexadecimal ID, N/A, or 00000000
    validations:
      required: true
  - type: dropdown
    id: gpu-backend
    attributes:
      label: Graphics backend
      options:
        - D3D12
        - Vulkan
        - Other or unknown
    validations:
      required: true
  - type: dropdown
    id: title-patch
    attributes:
      label: External title patch or startup workaround
      description: Say whether your setup uses one; do not attach game data or patch files.
      options:
        - None
        - External title patch
        - Separate startup workaround
        - Both
        - Unsure
    validations:
      required: true
  - type: textarea
    id: settings
    attributes:
      label: Relevant settings
      description: Include command-line flags and any relevant config values, especially Kinect settings.
      render: text
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Give the shortest sequence that reproduces the problem.
      placeholder: |
        1. Start the emulator with ...
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
      description: Describe what you expected, what happened, and whether it is repeatable.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Attach a relevant emulator log or screenshot after checking it for private information. Do not attach personal recordings, game images, SDK files, or driver files.
    validations:
      required: false
